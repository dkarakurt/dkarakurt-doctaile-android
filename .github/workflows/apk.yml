name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK'yı derle
        run: gradle assembleDebug --no-daemon

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk doctaile.apk

      - name: Çalışma çıktısı olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: doctaile-apk
          path: doctaile.apk

      - name: Sürüm sayfasına koy (tek tıkla indirme)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: doctaile derleme ${{ github.run_number }}
          body: Telefona doctaile.apk dosyasını indirip kur. Bilinmeyen kaynaklardan yükleme izni gerekir.
          files: doctaile.apk
