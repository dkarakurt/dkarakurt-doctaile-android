name: APK ve AAB derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCTAILE_STORE_PASSWORD: ${{ secrets.DOCTAILE_STORE_PASSWORD }}
      DOCTAILE_KEY_PASSWORD: ${{ secrets.DOCTAILE_KEY_PASSWORD }}
      DOCTAILE_KEY_ALIAS: ${{ secrets.DOCTAILE_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: İmza anahtarını hazırla
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.DOCTAILE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "DOCTAILE_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCTAILE_KEYSTORE_BASE64 secret'ı yok: APK debug anahtarıyla imzalanacak, Play için AAB üretilmeyecek."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Derle (imzalı APK + Play için AAB)
        if: steps.key.outputs.signed == 'true'
        run: |
          gradle assembleRelease bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk doctaile.apk
          cp app/build/outputs/bundle/release/app-release.aab doctaile.aab

      - name: Derle (anahtarsız, yalnızca APK)
        if: steps.key.outputs.signed != 'true'
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk doctaile.apk

      - name: Çalışma çıktısı olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: doctaile-${{ github.run_number }}
          path: |
            doctaile.apk
            doctaile.aab
          if-no-files-found: ignore

      - name: Sürüm sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: doctaile derleme ${{ github.run_number }}
          body: |
            doctaile.apk: telefona doğrudan kurulum için.
            doctaile.aab: Google Play Console'a yüklemek için (yalnızca imza anahtarı tanımlıysa üretilir).
          files: |
            doctaile.apk
            doctaile.aab
          fail_on_unmatched_files: false
